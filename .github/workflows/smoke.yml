name: Container Smoke

# 镜像构建通过后，用「旧 schema 的库」把新镜像真的跑起来一次：
# 模拟 NAS 上的升级动作（拉新镜像 → 挂载已有 db → 启动 → 调接口）。
# 这是 pytest 覆盖不到的一层：镜像能否启动、迁移会不会炸、端口与认证是否正常。
on:
  workflow_run:
    workflows: ["Build and Push Docker Image"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

jobs:
  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}:latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull freshly built image
        run: docker pull "$IMAGE"

      - name: Prepare old-schema database
        run: python .github/scripts/make_old_db.py "$PWD/smoke/db/fryfrog.db"

      - name: Start container against the existing db
        run: |
          docker run -d --name smoke \
            -e SQLITE_PATH=/data/fryfrog.db \
            -e AUTH_ENABLED=true \
            -e AUTH_PASSWORD=smoke-pw \
            -e LOG_HOME=/data/logs \
            -v "$PWD/smoke/db:/data" \
            -p 20058:20058 \
            "$IMAGE"

      - name: Wait for readiness and exercise the API
        run: |
          code=000
          for _ in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:20058/swagger-ui.html || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          echo "swagger -> $code"
          [ "$code" = "200" ] || { docker logs smoke; exit 1; }

          token=$(curl -s -X POST http://127.0.0.1:20058/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"smoke-pw"}' \
            | python -c 'import json,sys; print((json.load(sys.stdin).get("data") or {}).get("token",""))')
          echo "login -> ${token:0:12}..."
          [ -n "$token" ] || { docker logs smoke; exit 1; }

          libs=$(curl -s -H "Authorization: Bearer $token" http://127.0.0.1:20058/api/v1/media-libraries)
          echo "libraries -> $libs"
          echo "$libs" | grep -q '旧库' || { echo "旧数据在升级后丢失"; docker logs smoke; exit 1; }

          echo "scan -> $(curl -s -X POST -H "Authorization: Bearer $token" \
            http://127.0.0.1:20058/api/v1/media-libraries/1/scan)"

      - name: Assert old db was migrated in place
        run: python .github/scripts/verify_migrated_db.py "$PWD/smoke/db/fryfrog.db"

      - name: Verify no startup errors in logs
        run: |
          docker logs smoke 2>&1 | tee /tmp/smoke.log
          ! grep -Ei "Traceback|ModuleNotFoundError|no such column|CRITICAL" /tmp/smoke.log

      - name: Cleanup
        if: always()
        run: |
          docker logs smoke >&2 || true
          docker rm -f smoke || true
