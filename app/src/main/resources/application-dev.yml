spring:
  datasource:
    url: jdbc:postgresql://localhost:54321/fryfroghub
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

hub:
  tmdb:
    api-key: ${TMDB_API_KEY:}
    language: zh-CN
    auto-scrape: true
  proxy:
    host: 127.0.0.1
    port: 7890
