server:
  port: ${SERVER_PORT:20058}

spring:
  application:
    name: fryfrog-hub-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  hikari:
    maximum-pool-size: ${DB_POOL_SIZE:10}
    connection-timeout: 30000
    read-only: false

watcher:
  periodic-scan: ${WATCHER_PERIODIC_SCAN:true}
  periodic-scan-interval: ${PERIODIC_SCAN_INTERVAL:30}

auth:
  enabled: ${AUTH_ENABLED:true}
  password: ${AUTH_PASSWORD:}
  token-ttl-seconds: ${AUTH_TOKEN_TTL:604800}
  login-max-failures: ${AUTH_LOGIN_MAX_FAILURES:5}
  login-lock-minutes: ${AUTH_LOGIN_LOCK_MINUTES:15}

video:
  root-paths: ${VIDEO_ROOT_PATHS:}
  ffmpeg-path: ${FFMPEG_PATH:}

tmdb:
  api-key: ${TMDB_API_KEY:}
  language: ${TMDB_LANGUAGE:zh-CN}
  image-size: ${TMDB_IMAGE_SIZE:original}
  include-adult: ${TMDB_INCLUDE_ADULT:true}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
