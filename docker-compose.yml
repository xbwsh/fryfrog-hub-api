services:
  fryfrog-hub-api:
    image: ghcr.io/xbwsh/fryfrog-hub-api:latest
    container_name: fryfrog-hub-api
    restart: unless-stopped
    network_mode: host
    environment:
      - DB_PATH=/data/fryfrog.db
    volumes:
      - ./db:/data
      - /vol00/HGST HSH721414ALE6M4/jav/anime:/data/media/anime
