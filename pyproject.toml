[project]
name = "fryfrog-hub-api"
version = "0.1.0"
description = "Video media backend API for metadata extraction and streaming"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "bcrypt>=4.1.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "Pillow>=10.0.0",
    "ebooklib>=0.18",
    "python-dotenv>=1.0.0",
    "cryptography>=42.0.0",
    "rarfile>=4.2",
    "py7zr>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fryfrog*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
